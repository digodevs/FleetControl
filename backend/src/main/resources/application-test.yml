spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fleetcontrol}
    username: ${SPRING_DATASOURCE_USERNAME:fleetcontrol}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me_local_password}
  jpa:
    show-sql: false

logging:
  level:
    org.flywaydb: INFO

app:
  jwt:
    secret: ${JWT_SECRET:test_secret_for_fleetcontrol_with_32_bytes_minimum}
    access-expiration-millis: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-expiration-millis: ${JWT_REFRESH_EXPIRATION:604800000}
