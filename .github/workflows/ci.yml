name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fleetcontrol
          POSTGRES_USER: fleetcontrol
          POSTGRES_PASSWORD: change_me_local_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleetcontrol -d fleetcontrol"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/fleetcontrol
      SPRING_DATASOURCE_USERNAME: fleetcontrol
      SPRING_DATASOURCE_PASSWORD: change_me_local_password
      JWT_SECRET: test_secret_for_fleetcontrol_with_32_bytes_minimum
      JWT_ACCESS_EXPIRATION: 900000
      JWT_REFRESH_EXPIRATION: 604800000

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests
        working-directory: backend
        run: ./mvnw clean test

      - name: Compile package
        working-directory: backend
        run: ./mvnw clean package

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node LTS
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        run: npm run build
